name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch: # This line allows manual triggering

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out

      - name: Purge Cloudflare Cache
        uses: cloudflare/cache-purge-action@v3.1.0
        with:
          cf_zone: ${{ secrets.CF_ZONE_ID }}
          cf_auth: ${{ secrets.CF_API_TOKEN }}
          purge_everything: true
